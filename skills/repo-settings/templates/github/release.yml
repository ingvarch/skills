changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Security
      labels: [security]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Maintenance
      labels: [refactor, tech-debt, chore, dependencies, <build, ci and test areas>]
    - title: Other
      labels: ['*']
