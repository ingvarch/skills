name: Bug report
description: Something in <Name> does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: request
    attributes:
      label: What you did
      description: The command, request or steps. Remove tokens and secrets.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output, error or response you got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened, with a link to the docs if they describe it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version, commit or URL where it happened.
    validations:
      required: true
